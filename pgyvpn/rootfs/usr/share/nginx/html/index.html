<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>蒲公英组网</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 2rem; background: var(--primary-background-color, #f5f5f5); color: var(--primary-text-color, #222); }
    main { max-width: 42rem; margin: 3rem auto; padding: 2rem; border-radius: 1rem; background: var(--card-background-color, #fff); box-shadow: 0 0.5rem 2rem #0002; }
    h1 { margin-top: 0; }
    p { line-height: 1.65; }
    a.button { display: inline-block; margin: 0.5rem 0; padding: 0.8rem 1.2rem; border-radius: 0.6rem; background: #d94135; color: white; text-decoration: none; font-weight: 650; }
    .note { opacity: 0.78; font-size: 0.92rem; }
    code { background: #8881; padding: 0.1rem 0.35rem; border-radius: 0.3rem; }
  </style>

<body>
  <main>
    <h1>蒲公英组网</h1>
    <p>蒲公英客户端由 <code>s6-overlay</code> 在后台守护运行。启动、登录与重连状态请查看加载项的<strong>日志</strong>页面。</p>
    <p><a class="button" href="https://console.sdwan.oray.com/" target="_blank" rel="noopener noreferrer">打开蒲公英控制台</a></p>
    <p class="note">控制台会在新标签页打开，并由贝锐蒲公英账号单独登录。Home Assistant Ingress 保护此入口页面，不会代替蒲公英账号验证。</p>
  </main>
